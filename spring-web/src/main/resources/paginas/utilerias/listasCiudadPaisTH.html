<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{plantillas/plantilla::head}">

    <meta charset="UTF-8">
    <title>Request Param</title>
</head>
<body>
<header th:replace="~{plantillas/plantilla::header}"></header>
<main class="container text-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
    <h1 th:text="${contenido}"></h1>

     <!-- -->
    <form th:action="@{/utilerias/listasCiudadPaisTHPost}"
    th:object="${formulario}"
    method="post">
        <select th:field="*{paisId}" onchange="this.form.submit()">
            <option value="">SELECCIONE UN PAIS</option>
            <option th:each="pa :${paises}"
                    th:value="${pa.idPais}"
                    th:text="${pa.nombre}">

            </option>

        </select>


        <select th:field="*{ciudadId}">
            <option value="">SELECCIONE UN PRDUCTO</option>
            <option th:each="ciu :${ciudades}"
                    th:value="${ciu.idCiudad}"
                    th:text="${ciu.nombre}">

            </option>

        </select>
        <button type="submit">GUARDAR</button>
        </form>



</main>
<footer th:replace="~{plantillas/plantilla::footer}"></footer>
<div th:replace="~{plantillas/plantilla :: paginaScripts}"></div>
</body>
</html>
